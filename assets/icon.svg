<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#2d124d" />
      <stop offset="100%" stop-color="#0f0c1b" />
    </linearGradient>
    <linearGradient id="csharpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b4dca" />
      <stop offset="50%" stop-color="#68217a" />
      <stop offset="100%" stop-color="#4e1a5b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="#68217a" stroke-width="4" filter="url(#shadow)" />

  <!-- Outer Hexagon / Node Network for OOP / Patterns -->
  <g stroke="url(#accentGrad)" stroke-width="3" fill="none" opacity="0.35">
    <polygon points="256,76 400,160 400,326 256,410 112,326 112,160" />
    <circle cx="256" cy="76" r="6" fill="#00d2ff" />
    <circle cx="400" cy="160" r="6" fill="#00d2ff" />
    <circle cx="400" cy="326" r="6" fill="#00d2ff" />
    <circle cx="256" cy="410" r="6" fill="#00d2ff" />
    <circle cx="112" cy="326" r="6" fill="#00d2ff" />
    <circle cx="112" cy="160" r="6" fill="#00d2ff" />
  </g>

  <!-- Central C# Hexagon Emblem -->
  <polygon points="256,128 368,192 368,320 256,384 144,320 144,192" fill="url(#csharpGrad)" stroke="#a855f7" stroke-width="6" filter="url(#shadow)" />

  <!-- Stylized C Character -->
  <path d="M 276 206 C 210 206 182 232 182 256 C 182 280 210 306 276 306 C 296 306 314 300 324 294 L 324 270 C 314 276 298 282 280 282 C 234 282 216 268 216 256 C 216 244 234 230 280 230 C 298 230 314 236 324 242 L 324 218 C 314 212 296 206 276 206 Z" fill="#ffffff" />

  <!-- Hash / Sharp Grid (#) -->
  <g stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round">
    <!-- Vertical slants -->
    <line x1="326" y1="216" x2="318" y2="296" />
    <line x1="346" y1="216" x2="338" y2="296" />
    <!-- Horizontal bars -->
    <line x1="312" y1="242" x2="356" y2="242" />
    <line x1="308" y1="270" x2="352" y2="270" />
  </g>
</svg>
